project_roots:
  - ~/Documents/Work/Projects
  - ~/Documents/Home

# How many folder levels under each project_root to scan (default: 1 = direct children only).
# Use 2 when projects live inside grouping folders (e.g. Projects/MyGroup/VHP2_manuscript).
project_scan_depth: 1

board:
  columns:
    - name: Plan
      tag: "Plan 📐"
      colour: 4
    - name: Watch
      tag: "Watch 👁️"
      colour: 2
    - name: Coding
      tag: "Coding 🤖"
      colour: 5
    - name: Write
      tag: "Write ✒️"
      colour: 6
    - name: Review
      tag: "Review 🖍️"
      colour: 7
    - name: Shipped
      tag: "Shipped 🚀"
      colour: 3
    - name: Paused
      tag: "Paused ⏸️"
      colour: 1

  meta_tags:
    - "URGENT ⚠️"
    - "Collab 🤝"
    - "Student 🎓"
    - "Completed ✔️"

  # Whole days in Shipped before adding the Completed meta tag (board Refresh and `forge archive`).
  archive_after_shipped_days: 7

  tag_aliases: {}

calendar:
  # Optional: limit `forge calendar` to these Calendar titles (exact match).
  # Omit or leave empty to include all event calendars.
  # include:
  #   - Work
  #   - Teaching

# Optional Apple Reminders task backend (EventKit). Lists match Forge project
# folders by title. Inbox list is shown but not treated as a project unless a
# folder has the same name. `gtd.reminders_list` is still read when
# reminders.list is omitted. align --apply creates missing lists; list colour
# follows the Finder column on create, move, and Refresh; Finder URGENT sets
# sentinel priority (Refresh / project-tag / paint-priorities); optional
# sentinel reminder mirrors the column.
reminders:
  enabled: false
  list: Forge
  snapshot_max_age_seconds: 900
  include_completed: false
  sync_on_move: false
  sync_from_reminders: false
  # sentinel_prefix: "Forge · "
  # source: iCloud
  # folder_aliases:
  #   "VHP2 ms": VHP2_manuscript

# Legacy keys (kept for backwards compatibility).
# Prefer `calendar.include` and `reminders.list` above.
# These may emit deprecation notes in future releases.
gtd:
  reminders_list: Forge
# due_conflict_policy, workspace_tags, and project_areas are similarly legacy.

# Optional OmniFocus bridge (Omni Automation / OmniJS via JXA).
# Dry-run is the default for align/apply; nothing writes OF or Finder tags without --apply.
omnifocus:
  enabled: false
  sync_on_move: false
  # On board Refresh, pull a unanimous OF column onto Finder workflow tags.
  sync_from_omnifocus: true
  # When a linked OF project is Done/Dropped, move Finder folder to Shipped on Refresh.
  sync_completed_project_to_shipped: true
  # Board/`forge move` leaving Shipped → reopen OF project (Done/Dropped → Active).
  reopen_of_project_when_leaving_shipped: true
  # Board/`forge move` entering Shipped → mark OF project Done.
  complete_of_project_when_entering_shipped: true
  allow_sync_with_drift: false
  snapshot_max_age_seconds: 900
  default_untagged_column: Watch
  propose_urgent_on_overdue: true
  propose_shipped_when_idle: true
  # Match Finder project_tag (default). Older pilots used plain "Forge".
  link_tag_root: "🔥 Forge"
  legacy_link_tag_roots: ["Forge"]
  # Nested fallback root (used only when flat_column_tags is false, or a column has no alias).
  column_tag_root: KanbanStatus
  legacy_column_tag_roots: ["ForgeColumn"]
  # Prefer existing OF status tags as the sole column markers (recommended).
  flat_column_tags: true
  # column_tag_aliases:
  #   Plan: "Plan 💡"
  #   Watch: "Watch 🚧"
  #   Coding: "Coding 🤖"
  #   Write: "Write ✒️"
  #   Review: "Review 🖍️"
  #   Shipped: "Shipped 🚀"
  #   Paused: "On hold ⏸︎"
  # Extra OF names still recognised when reading (not written):
  # column_tag_alias_reads:
  #   "Watch Later 🎬": Watch
  # folder_aliases:
  #   OldTagName: ActualFolderName

# Preferred terminal for `forge edit` and board “open in Vim”.
# auto = Herdr → tmux → first installed GUI (Ghostty, kitty, iTerm, Warp, cmux, Terminal).
# Or set herdr, tmux, Ghostty, kitty, iTerm, Warp, cmux, Terminal.
terminal: auto
project_tag: "🔥 Forge"
