terminal: auto
project_tag: "🔥 Forge"

# How to resolve conflicts when both markdown and Reminders change a task’s due date/time.
# Options:
# - reminders: prefer Reminders due date/time
# - markdown: prefer markdown @due(...)
# - newest: prefer whichever side appears newer (Reminder lastModifiedDate vs task file mtime)
due_conflict_policy: newest

