project_roots:
  - ~/Documents/Work/Projects
  - ~/Documents/Home

# How many folder levels under each project_root to scan (default: 1 = direct children only).
# Use 2 when projects live inside grouping folders (e.g. Projects/MyGroup/VHP2_manuscript).
project_scan_depth: 1

board:
  columns:
    - name: Plan
      tag: "Plan 📐"
      colour: 4
    - name: Watch
      tag: "Watch 👁️"
      colour: 2
    - name: Coding
      tag: "Coding 🤖"
      colour: 5
    - name: Write
      tag: "Write ✒️"
      colour: 6
    - name: Review
      tag: "Review 🖍️"
      colour: 7
    - name: Shipped
      tag: "Shipped 🚀"
      colour: 3
    - name: Paused
      tag: "Paused ⏸️"
      colour: 1

  meta_tags:
    - "URGENT ⚠️"
    - "Collab 🤝"
    - "Student 🎓"

  tag_aliases: {}

calendar:
  # Optional: limit `forge calendar` to these Calendar titles (exact match).
  # Omit or leave empty to include all event calendars.
  # include:
  #   - Work
  #   - Teaching

# Legacy keys (kept for backwards compatibility; unused by the kanban CLI).
# Prefer `calendar.include` above. These may emit deprecation notes in future releases.
gtd:
  reminders_list: Forge
# due_conflict_policy, workspace_tags, and project_areas are similarly legacy.

terminal: auto
project_tag: "🔥 Forge"
