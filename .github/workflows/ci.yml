# Build and test on pull requests and pushes to main.
#
# Uses macos-15 so the toolchain matches Swift 6 / swift-tools-version 6.0.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test portable Python and Linux CLI
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r scripts/requirements.txt
          .venv/bin/python -m unittest discover -s Tests/linux -p 'test_*.py'
          .venv/bin/python -m unittest discover -s Tests -p 'test_*.py'
          .venv/bin/python -m py_compile scripts/linux/forge scripts/linux/forge_tags.py scripts/linux/forge_sidecar.py

  build-and-test:
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test Python integrations
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r scripts/requirements.txt
          .venv/bin/python -m unittest discover -s Tests -p 'test_*.py'
          .venv/bin/python -m unittest discover -s Tests/scripts -p 'test_*.py'

      - name: Compile brief script
        run: python3 -m py_compile scripts/forge-brief.py
