# Deploy static docs/ to GitHub Pages (https://<user>.github.io/<repo>/).
#
# Repository Settings → Pages → Build and deployment → Source: **GitHub Actions**
# (disable "Deploy from a branch" if it was enabled, to avoid duplicate publishing.)
#
# Opt into Node.js 24 for JavaScript-based actions (see GitHub deprecation notice for Node 20).

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install docs dependencies
        run: pip3 install -r docs/requirements.txt

      - name: Regenerate static HTML from markdown
        run: python3 docs/build_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
