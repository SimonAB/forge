# Build the `forge` CLI for Apple Silicon (arm64) and attach a zip to the GitHub
# release for the pushed tag. Stable download URL:
# https://github.com/SimonAB/forge/releases/latest/download/forge-macos-arm64.zip
#
# Uses macos-15 so the toolchain matches Swift 6 / swift-tools-version 6.0.
# Release publishing uses the `gh` CLI (no third-party Node actions).

name: Release CLI binary

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build release (arm64)
        run: swift build -c release --product forge

      - name: Package zip
        run: |
          set -e
          mkdir -p dist
          BIN="$(swift build -c release --product forge --show-bin-path)/forge"
          cp "$BIN" dist/forge
          chmod +x dist/forge
          file dist/forge
          lipo -archs dist/forge
          cp LICENSE dist/
          cp packaging/README-BINARY.txt dist/
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > dist/VERSION
          cd dist && zip -r ../forge-macos-arm64.zip forge LICENSE README-BINARY.txt VERSION

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" forge-macos-arm64.zip --clobber --repo "$REPO"
          else
            gh release create "$TAG" forge-macos-arm64.zip --generate-notes --repo "$REPO"
          fi
