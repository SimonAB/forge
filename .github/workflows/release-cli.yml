# Build the `forge` CLI and Forge.app (menubar) for Apple Silicon (arm64), attach
# zips to the GitHub release, and regenerate Sparkle `docs/appcast.xml` on `main`
# when SPARKLE_EDDSA_PRIVATE_KEY is configured (see packaging/SPARKLE_SIGNING.md).
#
# Stable download URLs:
#   https://github.com/SimonAB/forge/releases/latest/download/forge-macos-arm64.zip
#   https://github.com/SimonAB/forge/releases/latest/download/Forge-macos-arm64.app.zip
#
# Uses macos-15 so the toolchain matches Swift 6 / swift-tools-version 6.0.

name: Release macOS binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build release (arm64)
        run: |
          swift build -c release --product forge
          swift build -c release --product forge-menubar

      - name: Package CLI zip
        run: |
          set -e
          mkdir -p dist
          BIN="$(swift build -c release --product forge --show-bin-path)/forge"
          cp "$BIN" dist/forge
          chmod +x dist/forge
          file dist/forge
          lipo -archs dist/forge
          cp LICENSE dist/
          cp packaging/README-BINARY.txt dist/
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > dist/VERSION
          cd dist && zip -r ../forge-macos-arm64.zip forge LICENSE README-BINARY.txt VERSION

      - name: Package Forge.app zip
        run: |
          set -e
          BIN="$(swift build -c release --product forge-menubar --show-bin-path)"
          mkdir -p dist-app
          zsh packaging/assemble_forge_app.sh "$GITHUB_WORKSPACE" "$BIN" "$GITHUB_WORKSPACE/dist-app/Forge.app"
          cd dist-app && zip -r -y ../Forge-macos-arm64.app.zip Forge.app

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" forge-macos-arm64.zip Forge-macos-arm64.app.zip --clobber --repo "$REPO"
          else
            gh release create "$TAG" forge-macos-arm64.zip Forge-macos-arm64.app.zip --generate-notes --repo "$REPO"
          fi

      - name: Regenerate Sparkle appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_EDDSA_PRIVATE_KEY:-}" ]; then
            echo "::warning::SPARKLE_EDDSA_PRIVATE_KEY secret is not set — skipping appcast regeneration (see packaging/SPARKLE_SIGNING.md)"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"
          SPARKLE_VER="$(python3 "$GITHUB_WORKSPACE/packaging/sparkle_release_version.py")"
          curl -sL -o /tmp/sparkle-rel.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz"
          rm -rf /tmp/sparkle-rel && mkdir /tmp/sparkle-rel
          tar xf /tmp/sparkle-rel.tar.xz -C /tmp/sparkle-rel
          GENAPP="$(find /tmp/sparkle-rel -name generate_appcast -type f -print -quit)"
          test -f "$GENAPP"
          mkdir -p sparkle-work
          if [ -f docs/appcast.xml ]; then
            cp docs/appcast.xml sparkle-work/
          fi
          cp Forge-macos-arm64.app.zip sparkle-work/
          PREFIX="https://github.com/${REPO}/releases/download/${TAG}/"
          printf '%s\n' "$SPARKLE_EDDSA_PRIVATE_KEY" | "$GENAPP" \
            --ed-key-file - \
            --download-url-prefix "$PREFIX" \
            sparkle-work
          cp sparkle-work/appcast.xml /tmp/appcast-generated.xml

      - name: Commit appcast to main
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_EDDSA_PRIVATE_KEY:-}" ] || [ ! -f /tmp/appcast-generated.xml ]; then
            exit 0
          fi
          git fetch origin main
          git checkout main
          git pull origin main
          cp /tmp/appcast-generated.xml docs/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          if git diff --staged --quiet; then
            echo "Appcast unchanged"
          else
            git commit -m "chore: update Sparkle appcast for ${GITHUB_REF_NAME}"
            git push origin main
          fi
          git checkout "${GITHUB_SHA}"
